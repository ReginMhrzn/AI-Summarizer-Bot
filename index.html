<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Summarizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html{color-scheme:light}
  body{font-family:'Poppins',sans-serif;height:100vh;height:100dvh;overflow:hidden;background:#ffffff;color:#1e293b}
  .safe-top{padding-top:env(safe-area-inset-top,0px)}
  .safe-bottom{padding-bottom:calc(0.75rem + env(safe-area-inset-bottom,0px))}
  #text{max-height:50vh;max-height:50dvh}

  /* backgrounds */
  .bg-neutral-950{background:#f8fafc !important}
  .bg-neutral-900{background:#ffffff !important}
  .bg-neutral-800{background:#f1f5f9 !important}
  .bg-black\/60{background:rgba(15,23,42,0.25) !important}

  /* borders */
  .border-neutral-800{border-color:#e2e8f0 !important}
  .border-neutral-700{border-color:#cbd5e1 !important}

  /* text */
  .text-neutral-100{color:#1e293b !important}
  .text-neutral-300{color:#475569 !important}
  .text-neutral-400{color:#64748b !important}
  .text-neutral-500{color:#94a3b8 !important}
  .placeholder-neutral-500::placeholder{color:#94a3b8 !important}

  /* hovers */
  .hover\:bg-neutral-800:hover{background:#e2e8f0 !important}
  .hover\:text-white:hover{color:#0f172a !important}

  /* blue accent */
  .text-violet-400{color:#3b82f6 !important}
  .text-violet-500{color:#2563eb !important}
  .bg-violet-600{background:#2563eb !important}
  .hover\:bg-violet-500:hover{background:#3b82f6 !important}
  .hover\:bg-violet-500\/10:hover{background:rgba(59,130,246,0.1) !important}
  .border-violet-500{border-color:#3b82f6 !important}
  .focus-within\:border-violet-500:focus-within{border-color:#2563eb !important}
  .peer-checked\:bg-violet-600:checked + span{background:#2563eb !important;color:#ffffff !important}
  .hover\:text-violet-400:hover{color:#60a5fa !important}
  .peer-focus-visible\:ring-violet-400:focus-visible + span{box-shadow:0 0 0 2px #60a5fa !important}

  /* pill labels readable */
  label span{color:#475569 !important}
  label input:checked + span{color:#ffffff !important}

  /* ---- sidebar behaviour ---- */
  @media (min-width: 768px) {
    #side { position: relative !important; transform: none !important; transition: width .2s ease; }
    #side.collapsed { width: 0 !important; padding: 0 !important; border-right: none !important; overflow: hidden; }
  }
</style>
</head>
<body>
<div class="flex h-full">

  <div id="overlay" class="fixed inset-0 z-30 hidden bg-black/60 md:hidden"></div>

  <!-- SIDEBAR -->
  <aside id="side" class="safe-top fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-neutral-800 bg-neutral-900 transition-transform motion-reduce:transition-none md:static md:translate-x-0">
    <div class="p-3">
      <button id="new" class="flex w-full items-center gap-2 rounded-xl border border-violet-500 px-3 py-2.5 text-sm font-medium text-violet-500 hover:bg-violet-500/10">
        <i class="fas fa-plus"></i>New summary</button>
    </div>
    <h2 class="px-4 pb-2 text-sm font-medium text-neutral-400"><i class="fas fa-clock-rotate-left mr-2"></i>History</h2>
    <ul id="hist" class="flex-1 space-y-1 overflow-y-auto px-2"></ul>
    <p id="empty" class="px-4 text-sm text-neutral-500">Your past summaries will show up here.</p>
    <div class="border-t border-neutral-800 p-3">
      <button id="clearHist" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-neutral-400 hover:bg-neutral-800 hover:text-neutral-100">
        <i class="fas fa-trash"></i>Clear history</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- NAV BAR -->
    <nav class="safe-top border-b border-neutral-800 bg-white">
      <div class="flex h-14 items-center gap-3 px-4">
        <button id="menu" class="text-neutral-300 hover:text-white" aria-label="Toggle history"><i class="fas fa-bars fa-lg"></i></button>
        <div class="flex items-center gap-2 font-semibold"><i class="fas fa-file-lines text-violet-500"></i>Summarizer</div>
      </div>
    </nav>

    <!-- CONTENT -->
    <main id="scroller" class="flex-1 overflow-y-auto">
      <div id="view" class="mx-auto w-full max-w-3xl px-4 py-6"></div>
    </main>

    <!-- INPUT BAR -->
    <footer class="safe-bottom px-3 pt-2">
      <div class="mx-auto max-w-3xl rounded-2xl border-2 border-dashed border-neutral-700 bg-neutral-900 p-4 focus-within:border-violet-500">
        <div class="mb-2 flex items-center gap-2 text-sm font-medium text-neutral-400">
          <i class="fas fa-paste text-violet-500"></i>
          <span>Paste your text</span>
        </div>
        <textarea id="text" rows="3" placeholder="Paste article, notes, or any long text here…"
          class="block w-full resize-none rounded-lg bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none"></textarea>
        <div class="mt-3 flex flex-wrap items-center gap-2">
          <div class="flex rounded-lg bg-neutral-800 p-0.5" role="group" aria-label="Summary length">
            <label class="cursor-pointer"><input type="radio" name="len" value="0.15" class="peer sr-only">
              <span class="block rounded-md px-3 py-1 text-sm peer-checked:bg-violet-600 peer-focus-visible:ring-2"><i class="fas fa-bolt mr-1"></i>Short</span></label>
            <label class="cursor-pointer"><input type="radio" name="len" value="0.3" class="peer sr-only" checked>
              <span class="block rounded-md px-3 py-1 text-sm peer-checked:bg-violet-600 peer-focus-visible:ring-2"><i class="fas fa-align-left mr-1"></i>Medium</span></label>
            <label class="cursor-pointer"><input type="radio" name="len" value="0.5" class="peer sr-only">
              <span class="block rounded-md px-3 py-1 text-sm peer-checked:bg-violet-600 peer-focus-visible:ring-2"><i class="fas fa-align-justify mr-1"></i>Long</span></label>
          </div>
          <span class="text-xs text-neutral-500"><span id="wc">0</span> words</span>

          <button id="pasteBtn" class="ml-auto flex h-9 items-center gap-1.5 rounded-lg border border-neutral-700 bg-neutral-900 px-3 text-xs font-medium text-neutral-400 hover:bg-neutral-800 hover:text-neutral-100" aria-label="Paste from clipboard">
            <i class="fas fa-paste"></i>Paste
          </button>

          <button id="go" class="flex h-9 items-center gap-2 rounded-lg bg-violet-600 px-4 text-sm font-medium text-white hover:bg-violet-500 disabled:opacity-50">
            <i class="fas fa-wand-magic-sparkles"></i>Summarize
          </button>
        </div>
      </div>
      <p class="mx-auto mt-2 max-w-3xl text-center text-xs text-neutral-500">Developed by <span class="font-medium text-violet-500">ReginMhrzn</span></p>
    </footer>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const words = t => (t.trim().match(/\S+/g) || []).length;
const NAMES = {"0.15": "Short", "0.3": "Medium", "0.5": "Long"};
const KEY = "summarizer_history_v1";
let current = "", activeId = null;

/* ---------- sidebar ---------- */
const isDesktop = () => matchMedia("(min-width: 768px)").matches;

function toggleSide() {
  if (isDesktop()) {
    $("side").classList.toggle("collapsed");
  } else {
    const hidden = $("side").classList.contains("-translate-x-full");
    $("side").classList.toggle("-translate-x-full", !hidden);
    $("overlay").classList.toggle("hidden", !hidden);
  }
}

function closeSideMobile() {
  if (!isDesktop()) {
    $("side").classList.add("-translate-x-full");
    $("overlay").classList.add("hidden");
  }
}

$("menu").onclick = toggleSide;
$("overlay").onclick = () => {
  $("side").classList.add("-translate-x-full");
  $("overlay").classList.add("hidden");
};

addEventListener("resize", () => {
  if (isDesktop()) {
    $("side").classList.remove("-translate-x-full");
    $("overlay").classList.add("hidden");
  } else {
    $("side").classList.remove("collapsed");
    $("side").classList.add("-translate-x-full");
    $("overlay").classList.add("hidden");
  }
});

/* ---------- input grows ---------- */
function grow() {
  const t = $("text");
  t.style.height = "auto";
  t.style.height = t.scrollHeight + "px";
}
$("text").addEventListener("input", () => { $("wc").textContent = words($("text").value); grow(); });
$("text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); }
});
grow();

/* ---------- paste button ---------- */
$("pasteBtn").onclick = async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (!t) return;
    const box = $("text");
    box.value = (box.value ? box.value + "\n" : "") + t;
    $("wc").textContent = words(box.value);
    grow();
    box.focus();
  } catch (_) {
    $("text").placeholder = "Clipboard blocked — paste manually (Ctrl/Cmd + V)";
    setTimeout(() => $("text").placeholder = "Paste article, notes, or any long text here…", 2500);
    $("text").focus();
  }
};

/* ---------- history ---------- */
function loadHist() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (_) { return []; } }
function saveHist(l) { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (_) {} }

function renderHist() {
  const list = loadHist(), ul = $("hist");
  ul.innerHTML = "";
  $("empty").classList.toggle("hidden", list.length > 0);
  list.forEach(item => {
    const li = document.createElement("li");
    li.className = "group flex items-center gap-1 rounded-lg pr-1 hover:bg-neutral-800 " + (item.id === activeId ? "bg-neutral-800" : "");
    const open = document.createElement("button");
    open.className = "min-w-0 flex-1 px-3 py-2 text-left";
    const title = document.createElement("div");
    title.className = "truncate text-sm";
    title.textContent = (item.text || item.summary).slice(0, 60);
    const sub = document.createElement("div");
    sub.className = "text-xs text-neutral-500";
    sub.textContent = item.len + " \u00b7 " + new Date(item.time).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
    open.append(title, sub);
    open.onclick = () => { showEntry(item); closeSideMobile(); };
    const del = document.createElement("button");
    del.className = "px-2 py-1 text-neutral-500 hover:text-violet-400";
    del.setAttribute("aria-label", "Delete this summary");
    del.innerHTML = '<i class="fas fa-xmark"></i>';
    del.onclick = () => { saveHist(loadHist().filter(x => x.id !== item.id)); if (activeId === item.id) showEmpty(); renderHist(); };
    li.append(open, del);
    ul.appendChild(li);
  });
}

/* ---------- main view ---------- */
function showEmpty() {
  activeId = null; current = "";
  $("view").innerHTML =
    '<div class="flex min-h-[50vh] flex-col items-center justify-center text-center">' +
    '<div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-violet-600 text-2xl text-white"><i class="fas fa-paste"></i></div>' +
    '<h1 class="text-2xl font-semibold">Paste your text below</h1>' +
    '<p class="mt-2 text-neutral-400">Copy any article, essay, or notes, then click <b>Paste</b> or paste manually into the box.</p></div>';
  renderHist();
}

function originalBlock(text) {
  const wrap = document.createElement("section");
  wrap.innerHTML = '<h2 class="mb-2 text-sm font-medium text-neutral-400"><i class="fas fa-pen mr-2"></i>Your text</h2>' +
    '<p class="whitespace-pre-wrap text-neutral-300"></p><button class="mt-1 hidden text-sm text-violet-500 hover:underline"></button>';
  const p = wrap.querySelector("p"), b = wrap.querySelector("button");
  p.textContent = text || "(The original text was too long to save.)";
  if (text && text.length > 350) {
    let open = false;
    p.classList.add("line-clamp-4");
    b.textContent = "Show more"; b.classList.remove("hidden");
    b.onclick = () => { open = !open; p.classList.toggle("line-clamp-4", !open); b.textContent = open ? "Show less" : "Show more"; };
  }
  return wrap;
}

function showEntry(item, loading) {
  activeId = item.id; current = item.summary || "";
  const v = $("view");
  v.innerHTML = "";
  v.appendChild(originalBlock(item.text));
  const s = document.createElement("section");
  s.className = "mt-6 border-t border-neutral-800 pt-6";
  if (loading) {
    s.innerHTML = '<div class="flex items-center gap-3 text-neutral-400"><i class="fas fa-spinner fa-spin text-violet-500"></i>Summarizing...</div>';
  } else {
    s.innerHTML = '<h2 class="mb-3 text-sm font-medium text-violet-500"><i class="fas fa-wand-magic-sparkles mr-2"></i>Summary</h2>' +
      '<p id="sumText" class="whitespace-pre-wrap text-lg leading-8"></p>' +
      '<div class="mt-4 flex items-center gap-4 text-sm text-neutral-500"><span id="stats"></span>' +
      '<button id="copy" class="text-neutral-300 hover:text-white"><i class="fas fa-copy mr-1"></i>Copy</button></div>';
    s.querySelector("#sumText").textContent = item.summary;
    s.querySelector("#stats").textContent = item.before + " \u2192 " + item.after + " words \u00b7 " + item.len;
    s.querySelector("#copy").onclick = async e => {
      const b = e.currentTarget;
      try { await navigator.clipboard.writeText(current); b.innerHTML = '<i class="fas fa-check mr-1"></i>Copied'; }
      catch (_) { b.textContent = "Press and hold to copy"; }
      setTimeout(() => b.innerHTML = '<i class="fas fa-copy mr-1"></i>Copy', 1800);
    };
  }
  v.appendChild(s);
  $("scroller").scrollTop = 0;
  renderHist();
}

function showError(msg) {
  $("view").innerHTML = '<div class="rounded-xl border border-neutral-700 bg-neutral-900 p-4"><i class="fas fa-circle-exclamation mr-2 text-violet-500"></i><span id="errMsg"></span></div>';
  $("errMsg").textContent = msg;
}

/* ---------- summarize ---------- */
async function send() {
  const text = $("text").value;
  if (!text.trim() || $("go").disabled) return;
  const ratio = document.querySelector('input[name="len"]:checked').value;
  $("go").disabled = true;
  showEntry({id: "loading", text, summary: ""}, true);
  try {
    const res = await fetch("/summarize", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, ratio: parseFloat(ratio)})
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    const item = {id: Date.now(), time: Date.now(), len: NAMES[ratio], text: text.length < 30000 ? text : "",
                  summary: d.summary, before: d.before, after: d.after};
    saveHist([item, ...loadHist()].slice(0, 20));
    $("text").value = ""; $("wc").textContent = "0"; grow();
    showEntry(item);
  } catch (e) {
    showError(e.message && e.message !== "Failed to fetch" ? e.message : "Could not reach the server. Check that app.py is still running.");
  } finally {
    $("go").disabled = false;
  }
}

const reset = () => { $("text").value = ""; $("wc").textContent = "0"; grow(); showEmpty(); closeSideMobile(); $("text").focus(); };
$("go").onclick = send;
$("new").onclick = reset;
$("clearHist").onclick = () => { saveHist([]); showEmpty(); };

showEmpty();
</script>
</body>
</html>
